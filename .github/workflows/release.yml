name: Release (PyPI wheel)

# Triggered when a v* tag is pushed (e.g. v2.0.0):
#   git tag v2.0.0 && git push origin v2.0.0
#
# Flow: frontend static export with Node → copy apps/api + bibex_core →
#       build a single wheel → upload to PyPI (Trusted Publishing / OIDC).
#
# Auth: PyPI Trusted Publishing (OIDC) — NO secret/token needed. The publisher is
#       configured on PyPI: Repository bcankara/BibexPy · Workflow release.yml.
#       (Fallback method: twine + PYPI_API_TOKEN secret; this workflow uses OIDC.)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # manual trigger

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) — no token needed
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci

      - name: Build wheel (static export + assemble + build)
        run: bash scripts/build_wheel.sh

      - name: Verify wheel contents
        run: |
          WHL=$(ls python_pkg/dist/*.whl)
          echo "Wheel: $WHL"
          python -m zipfile -l "$WHL" | grep -E "_server/main.py|_web/index.html|bibex_core/scp2xlsx.py" \
            || { echo "ERROR: wheel is missing contents"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bibexpy-dist
          path: python_pkg/dist/*

      # PyPI Trusted Publishing (OIDC) — the publisher is configured on PyPI:
      #   Repository: bcankara/BibexPy · Workflow: release.yml
      # No need to store a token/secret; identity is verified via GitHub OIDC.
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python_pkg/dist
