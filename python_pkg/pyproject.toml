# BibexPy v2 — PyPI paketi (pip install bibexpy)
#
# This package is the DISTRIBUTION wrapper for the development sources in `apps/`
# and `packages/bibex_core`. The build script (scripts/build_wheel.*) copies the
# following three parts under `src/` and produces the wheel:
#   • apps/web/out/        → src/bibexpy/_web/      (Next.js static export)
#   • apps/api/{...}       → src/bibexpy/_server/   (FastAPI application)
#   • packages/bibex_core/ → src/bibex_core/        (core modules, vendored)
#
# End user:  pip install bibexpy && bibexpy
# Node.js / npm is NOT required — the frontend ships as pre-built static files.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bibexpy"
version = "2.3.0"
description = "Self-hosted bibliometric data preparation tool (Scopus + Web of Science)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Burak Can Kara" },
    { name = "Alperen Şahin" },
    { name = "Taşkın Dirsehan" },
]
keywords = ["bibliometrics", "scientometrics", "scopus", "web of science", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Framework :: FastAPI",
]

dependencies = [
    # --- FastAPI stack (same as apps/api/requirements.txt) ---
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sse-starlette>=2.0.0",
    # --- bibex_core dependencies (the vendored package requests its own deps from PyPI) ---
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.2",
    # The Data Flow Diagram PDF output (services/report_flow.py) imports this
    # directly; because it was not declared, the PDF download returned a 500 with
    # ModuleNotFoundError on pip installs.
    "reportlab>=4.0",
    "pyarrow>=15",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "certifi>=2023.5.7",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
    "unidecode==1.3.6",
    "typing-extensions>=4.7.0",
]

[project.scripts]
bibexpy = "bibexpy.cli:main"

[project.urls]
Homepage = "https://bibexpy.com"
Repository = "https://github.com/bcankara/BibexPy"
Paper = "https://doi.org/10.1016/j.softx.2025.102098"

# --- setuptools configuration ---
# _server is discovered as a sub-package (the build script adds
# `_server/__init__.py`) → all .py modules are included in the wheel. IMPORTANT:
# setuptools does not reliably ship `.py` files via package-data (it treats them as
# modules and excludes them); that is why _server MUST be discovered as a package.
# _web, on the other hand, is pure static files (html/js/css), so it is shipped via
# the package-data glob.
#
# At runtime, cli.py resolves the flat imports (from config import ..., from routers
# import ...) by adding the _server directory to sys.path; this does not conflict
# with dotted access (bibexpy._server.config) because that path is never used.
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false
# Packages are listed explicitly (the output of find_packages('src')) — deterministic.
# The _server subtree is included as packages so that the .py modules end up in the wheel.
packages = [
    "bibexpy",
    "bibexpy._server",
    "bibexpy._server.jobs",
    "bibexpy._server.models",
    "bibexpy._server.routers",
    "bibexpy._server.services",
    "bibexpy._server.services.disambiguation",
    "bibex_core",
    "bibex_core.modules",
]

[tool.setuptools.package-data]
# _web is the pure static UI + _samples is the example dataset ("Simple Project") —
# recursive glob (setuptools>=62 supports `**`).
bibexpy = ["_web/**/*", "_web/**/.*", "_samples/**/*"]
